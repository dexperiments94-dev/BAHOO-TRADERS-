<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store</title>

<!-- ======================================================
     QUICK SETUP — edit these 5 lines and you're live
====================================================== -->
<script>
  const STORE_NAME       = "Bahoo Traders";
  const JAZZCASH_NUMBER  = "0300-1234567";
  const EASYPAISA_NUMBER = "0300-1234567";
  const CURRENCY         = "Rs.";
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Firebase (free tier is plenty for this) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ================================================
  // PASTE YOUR FIREBASE CONFIG HERE (same as admin.html)
  // Firebase Console → Project Settings → Your apps → Config
  // ================================================
  const firebaseConfig = {
    apiKey: "AIzaSyAIlG297vfNbYFwjEfmtdgKfoJef1d-22w",
    authDomain: "bahoo-traders.firebaseapp.com",
    projectId: "bahoo-traders",
    storageBucket: "bahoo-traders.firebasestorage.app",
    messagingSenderId: "465050348956",
    appId: "1:465050348956:web:b368133cd5756371cbec59"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let PRODUCTS = [];
  let CART = JSON.parse(localStorage.getItem("cart") || "[]");

  async function loadProducts() {
    const grid = document.getElementById("grid");
    try {
      const snap = await getDocs(collection(db, "products"));
      PRODUCTS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) {
      console.error(e);
      grid.innerHTML = `<p class="empty">Couldn't load products. Check your Firebase config at the top of this file.</p>`;
      return;
    }
    renderGrid();
  }

  function renderGrid(filter = "") {
    const grid = document.getElementById("grid");
    const items = PRODUCTS.filter(p => p.name?.toLowerCase().includes(filter.toLowerCase()));
    if (!items.length) {
      grid.innerHTML = `<p class="empty">No products yet. Add some from the admin panel.</p>`;
      return;
    }
    grid.innerHTML = items.map(p => `
      <div class="card">
        ${p.stock !== undefined && p.stock <= 0 ? `<span class="tag out">Out of stock</span>` : ""}
        <div class="thumb"><img src="${p.image || 'https://placehold.co/400x400?text=No+Image'}" alt="${p.name}" loading="lazy"></div>
        <div class="card-body">
          <h3>${p.name}</h3>
          <p class="desc">${p.description || ""}</p>
          <div class="row">
            <span class="price">${CURRENCY} ${Number(p.price || 0).toLocaleString()}</span>
            <button class="add-btn" ${p.stock !== undefined && p.stock <= 0 ? "disabled" : ""} onclick="addToCart('${p.id}')">Add</button>
          </div>
        </div>
      </div>
    `).join("");
  }

  window.addToCart = function(id) {
    const existing = CART.find(c => c.id === id);
    if (existing) existing.qty += 1;
    else CART.push({ id, qty: 1 });
    saveCart();
    pulseCart();
  };

  window.changeQty = function(id, delta) {
    const item = CART.find(c => c.id === id);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) CART = CART.filter(c => c.id !== id);
    saveCart();
    renderCart();
  };

  function saveCart() {
    localStorage.setItem("cart", JSON.stringify(CART));
    document.getElementById("cart-count").textContent = CART.reduce((s, c) => s + c.qty, 0);
    renderCart();
  }

  function pulseCart() {
    const btn = document.getElementById("cart-btn");
    btn.classList.add("pulse");
    setTimeout(() => btn.classList.remove("pulse"), 300);
  }

  function cartDetails() {
    return CART.map(c => {
      const p = PRODUCTS.find(p => p.id === c.id);
      return p ? { ...p, qty: c.qty } : null;
    }).filter(Boolean);
  }

  function renderCart() {
    const list = document.getElementById("cart-list");
    const details = cartDetails();
    if (!details.length) {
      list.innerHTML = `<p class="empty">Cart is empty.</p>`;
      document.getElementById("cart-total").textContent = "";
      document.getElementById("checkout-btn").disabled = true;
      return;
    }
    document.getElementById("checkout-btn").disabled = false;
    let total = 0;
    list.innerHTML = details.map(p => {
      const line = p.price * p.qty;
      total += line;
      return `
        <div class="cart-row">
          <img src="${p.image || 'https://placehold.co/80x80?text=No+Image'}" alt="${p.name}">
          <div class="cart-row-info">
            <span>${p.name}</span>
            <span class="muted">${CURRENCY} ${p.price.toLocaleString()} × ${p.qty}</span>
          </div>
          <div class="qty-ctrl">
            <button onclick="changeQty('${p.id}',-1)">−</button>
            <span>${p.qty}</span>
            <button onclick="changeQty('${p.id}',1)">+</button>
          </div>
        </div>`;
    }).join("");
    document.getElementById("cart-total").textContent = `${CURRENCY} ${total.toLocaleString()}`;
  }

  window.submitOrder = async function(e) {
    e.preventDefault();
    const name = document.getElementById("f-name").value.trim();
    const phone = document.getElementById("f-phone").value.trim();
    const address = document.getElementById("f-address").value.trim();
    const payment = document.querySelector('input[name="payment"]:checked').value;
    const details = cartDetails();
    if (!details.length) return;
    const total = details.reduce((s, p) => s + p.price * p.qty, 0);

    const submitBtn = document.getElementById("place-order-btn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Placing order...";

    try {
      await addDoc(collection(db, "orders"), {
        customerName: name,
        phone,
        address,
        payment,
        items: details.map(p => ({ id: p.id, name: p.name, price: p.price, qty: p.qty })),
        total,
        status: "pending",
        createdAt: serverTimestamp()
      });
    } catch (err) {
      console.error(err);
      submitBtn.disabled = false;
      submitBtn.textContent = "Place Order";
      alert("Order could not be sent. Please check your internet connection and try again.");
      return;
    }

    CART = [];
    saveCart();
    document.getElementById("checkout-form").reset();
    submitBtn.disabled = false;
    submitBtn.textContent = "Place Order";
    closeCheckout();
    showConfirmation(payment, total);
  };

  function showConfirmation(payment, total) {
    const modal = document.getElementById("confirm-modal");
    const body = document.getElementById("confirm-body");
    const paymentNote = payment === "online"
      ? `<p class="receipt-note">Please pay <strong>${CURRENCY} ${total.toLocaleString()}</strong> to:<br>JazzCash: ${JAZZCASH_NUMBER}<br>Easypaisa: ${EASYPAISA_NUMBER}</p>`
      : `<p class="receipt-note">Pay <strong>${CURRENCY} ${total.toLocaleString()}</strong> in cash on delivery.</p>`;
    body.innerHTML = `<h2>Order placed ✅</h2><p>We've received your order and will confirm it shortly.</p>${paymentNote}`;
    modal.classList.add("open");
  }
  window.closeConfirm = function() { document.getElementById("confirm-modal").classList.remove("open"); };

  window.addEventListener("DOMContentLoaded", () => {
    document.getElementById("store-name").textContent = STORE_NAME;
    document.title = STORE_NAME;
    loadProducts();
    saveCart();
    document.getElementById("search").addEventListener("input", (e) => renderGrid(e.target.value));
  });
</script>

<style>
  :root {
    --ink: #10241F;
    --teal: #0E4B45;
    --teal-deep: #0A3733;
    --saffron: #E9A23B;
    --cream: #FAF3E7;
    --coral: #D65A46;
    --line: #E4D9C3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--cream); color: var(--ink); }
  h1, h2, h3, .brand { font-family: 'Space Grotesk', sans-serif; }

  header {
    background: var(--teal);
    color: var(--cream);
    padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  #cart-btn {
    background: var(--saffron); color: var(--teal-deep); border: none;
    border-radius: 999px; padding: 10px 18px; font-weight: 700; font-family: 'Inter';
    cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 14px;
    transition: transform 0.2s;
  }
  #cart-btn.pulse { transform: scale(1.12); }
  #cart-count { background: var(--coral); color: white; border-radius: 999px; padding: 1px 8px; font-size: 12px; }

  .hero {
    background: var(--teal-deep); color: var(--cream);
    padding: 36px 20px 28px; text-align: center;
  }
  .hero h1 { font-size: 26px; margin: 0 0 6px; }
  .hero p { margin: 0 0 18px; opacity: 0.75; font-size: 14px; }
  #search {
    width: 100%; max-width: 420px; padding: 12px 16px; border-radius: 999px;
    border: none; font-family: 'Inter'; font-size: 15px;
  }

  #grid {
    max-width: 1100px; margin: 0 auto; padding: 24px 16px 90px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px;
  }
  .card {
    background: white; border-radius: 14px; overflow: hidden; position: relative;
    border: 1px solid var(--line); display: flex; flex-direction: column;
  }
  .tag.out {
    position: absolute; top: 8px; left: 8px; background: var(--coral); color: white;
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; z-index: 2;
  }
  .thumb { aspect-ratio: 1; background: #f2ece0; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card-body h3 { font-size: 14px; margin: 0; line-height: 1.3; }
  .desc { font-size: 12px; color: #7a7368; margin: 0; flex: 1; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .price { font-weight: 700; font-size: 14px; color: var(--teal-deep); }
  .add-btn {
    background: var(--teal); color: white; border: none; border-radius: 8px;
    padding: 7px 14px; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .add-btn:disabled { background: #ccc; cursor: not-allowed; }
  .empty { text-align: center; color: #9a9384; grid-column: 1/-1; padding: 40px 0; }

  #cart-panel {
    position: fixed; top: 0; right: -100%; width: 100%; max-width: 380px; height: 100%;
    background: var(--cream); box-shadow: -4px 0 20px rgba(0,0,0,0.2);
    transition: right 0.3s ease; z-index: 20; display: flex; flex-direction: column;
  }
  #cart-panel.open { right: 0; }
  .cart-header {
    background: var(--teal); color: white; padding: 18px 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .cart-header button { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
  #cart-list { flex: 1; overflow-y: auto; padding: 14px; }
  .cart-row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .cart-row img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
  .cart-row-info { flex: 1; display: flex; flex-direction: column; font-size: 13px; }
  .muted { color: #8a8375; font-size: 12px; }
  .qty-ctrl { display: flex; align-items: center; gap: 8px; }
  .qty-ctrl button {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line);
    background: white; cursor: pointer; font-size: 15px;
  }
  .cart-footer { padding: 16px 20px; border-top: 1px solid var(--line); background: white; }
  .cart-total-row { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 12px; }
  #checkout-btn, #place-order-btn {
    width: 100%; padding: 13px; background: var(--saffron); color: var(--teal-deep);
    border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; font-family: 'Inter';
  }
  #checkout-btn:disabled { background: #ddd; color: #999; cursor: not-allowed; }

  #overlay {
    display: none; position: fixed; inset: 0; background: rgba(16,36,31,0.5); z-index: 15;
  }
  #overlay.open { display: block; }

  #checkout-modal {
    display: none; position: fixed; inset: 0; z-index: 30; align-items: flex-end; justify-content: center;
  }
  #checkout-modal.open { display: flex; }
  #confirm-modal { display: none; position: fixed; inset: 0; z-index: 35; align-items: center; justify-content: center; background: rgba(16,36,31,0.55); }
  #confirm-modal.open { display: flex; }
  #confirm-body h2 { margin: 0 0 8px; font-size: 20px; }
  #confirm-body p { font-size: 14px; margin: 0 0 8px; }
  .sheet {
    background: white; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0;
    padding: 22px 20px 30px; max-height: 88vh; overflow-y: auto;
  }
  .sheet h2 { margin: 0 0 4px; font-size: 20px; }
  .receipt-note {
    font-family: 'Space Grotesk'; font-size: 12px; color: #8a8375; margin: 0 0 16px;
    border-bottom: 1px dashed var(--line); padding-bottom: 14px;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field input, .field textarea {
    width: 100%; padding: 11px 13px; border-radius: 9px; border: 1px solid var(--line);
    font-family: 'Inter'; font-size: 14px; background: var(--cream);
  }
  .pay-options { display: flex; gap: 10px; margin-bottom: 16px; }
  .pay-option {
    flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px;
    cursor: pointer; text-align: center; font-size: 13px; font-weight: 600;
  }
  .pay-option input { margin-right: 6px; }
  .close-x { background: none; border: none; font-size: 20px; float: right; cursor: pointer; }

  @media (min-width: 700px) {
    #checkout-modal { align-items: center; }
    .sheet { border-radius: 18px; }
  }
</style>
</head>
<body>

<header>
  <span class="brand" id="store-name">Store</span>
  <button id="cart-btn" onclick="document.getElementById('cart-panel').classList.add('open'); document.getElementById('overlay').classList.add('open')">
    🛒 Cart <span id="cart-count">0</span>
  </button>
</header>

<div class="hero">
  <h1>Fresh stock, fast delivery</h1>
  <p>Browse and order — checkout finishes on WhatsApp</p>
  <input id="search" type="text" placeholder="Search products...">
</div>

<div id="grid"><p class="empty">Loading products...</p></div>

<div id="overlay" onclick="document.getElementById('cart-panel').classList.remove('open'); this.classList.remove('open')"></div>

<div id="cart-panel">
  <div class="cart-header">
    <span>Your Cart</span>
    <button onclick="document.getElementById('cart-panel').classList.remove('open'); document.getElementById('overlay').classList.remove('open')">✕</button>
  </div>
  <div id="cart-list"><p class="empty">Cart is empty.</p></div>
  <div class="cart-footer">
    <div class="cart-total-row"><span>Total</span><span id="cart-total"></span></div>
    <button id="checkout-btn" disabled onclick="document.getElementById('checkout-modal').classList.add('open')">Checkout</button>
  </div>
</div>

<div id="checkout-modal">
  <div class="sheet">
    <button class="close-x" onclick="closeCheckoutHandler()">✕</button>
    <h2>Complete your order</h2>
    <p class="receipt-note">Order details are sent to us on WhatsApp — you'll tap Send to confirm.</p>
    <form id="checkout-form" onsubmit="submitOrder(event)">
      <div class="field"><label>Full name</label><input id="f-name" required></div>
      <div class="field"><label>Phone number</label><input id="f-phone" type="tel" required></div>
      <div class="field"><label>Delivery address</label><textarea id="f-address" rows="2" required></textarea></div>
      <div class="field">
        <label>Payment method</label>
        <div class="pay-options">
          <label class="pay-option"><input type="radio" name="payment" value="cod" checked> Cash on Delivery</label>
          <label class="pay-option"><input type="radio" name="payment" value="online"> Online (JazzCash/Easypaisa)</label>
        </div>
      </div>
      <button id="place-order-btn" type="submit">Place Order</button>
    </form>
  </div>
</div>

<div id="confirm-modal">
  <div class="sheet">
    <button class="close-x" onclick="closeConfirm()">✕</button>
    <div id="confirm-body"></div>
  </div>
</div>

<script>
  function closeCheckout() {
    document.getElementById('checkout-modal').classList.remove('open');
  }
  function closeCheckoutHandler() { closeCheckout(); }
</script>

</body>
</html>
