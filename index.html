<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Store</title>

<!-- ======================================================
     QUICK SETUP — edit these lines and you're live
====================================================== -->
<script>
  const STORE_NAME       = "Bahoo Traders";
  const JAZZCASH_NUMBER  = "0300-1234567";
  const EASYPAISA_NUMBER = "0300-1234567";
  const CURRENCY         = "Rs.";
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAIlG297vfNbYFwjEfmtdgKfoJef1d-22w",
    authDomain: "bahoo-traders.firebaseapp.com",
    projectId: "bahoo-traders",
    storageBucket: "bahoo-traders.firebasestorage.app",
    messagingSenderId: "465050348956",
    appId: "1:465050348956:web:b368133cd5756371cbec59"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let PRODUCTS = [];
  let CART = JSON.parse(localStorage.getItem("cart") || "[]");
  let ACTIVE_CATEGORY = "All";

  async function loadProducts() {
    const grid = document.getElementById("grid");
    try {
      const snap = await getDocs(collection(db, "products"));
      PRODUCTS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) {
      console.error(e);
      grid.innerHTML = `<p class="empty">Couldn't load products. Check your Firebase config.</p>`;
      return;
    }
    renderCategories();
    renderGrid();
  }

  function renderCategories() {
    const bar = document.getElementById("category-bar");
    const cats = Array.from(new Set(PRODUCTS.map(p => p.category).filter(Boolean)));
    if (!cats.length) { bar.style.display = "none"; return; }
    bar.style.display = "flex";
    const all = ["All", ...cats];
    bar.innerHTML = all.map(c => `
      <button class="chip ${c === ACTIVE_CATEGORY ? "active" : ""}" onclick="setCategory('${c.replace(/'/g,"\\'")}')">${c}</button>
    `).join("");
  }

  window.setCategory = function(cat) {
    ACTIVE_CATEGORY = cat;
    renderCategories();
    renderGrid(document.getElementById("search").value);
  };

  function qtyInCart(id) {
    const item = CART.find(c => c.id === id);
    return item ? item.qty : 0;
  }

  function renderGrid(filter = "") {
    const grid = document.getElementById("grid");
    let items = PRODUCTS.filter(p => p.name?.toLowerCase().includes(filter.toLowerCase()));
    if (ACTIVE_CATEGORY !== "All") items = items.filter(p => p.category === ACTIVE_CATEGORY);
    if (!items.length) {
      grid.innerHTML = `<p class="empty">No products yet. Add some from the admin panel.</p>`;
      return;
    }
    grid.innerHTML = items.map(p => {
      const outOfStock = p.stock !== undefined && p.stock !== null && p.stock <= 0;
      const qty = qtyInCart(p.id);
      return `
      <div class="card">
        ${outOfStock ? `<span class="tag out">Sold out</span>` : (p.badge ? `<span class="tag badge">${p.badge}</span>` : "")}
        <div class="thumb"><img src="${p.image || 'https://placehold.co/400x400?text=No+Image'}" alt="${p.name}" loading="lazy"></div>
        <div class="card-body">
          <h3>${p.name}</h3>
          <p class="desc">${p.description || ""}</p>
          <div class="row">
            <span class="price">${CURRENCY} ${Number(p.price || 0).toLocaleString()}</span>
            ${outOfStock ? `<button class="add-btn" disabled>Sold out</button>` :
              qty > 0 ? `
                <div class="stepper">
                  <button onclick="changeQty('${p.id}',-1)">−</button>
                  <span>${qty}</span>
                  <button onclick="changeQty('${p.id}',1)">+</button>
                </div>` :
              `<button class="add-btn" onclick="addToCart('${p.id}')">Add</button>`}
          </div>
        </div>
      </div>`;
    }).join("");
  }

  window.addToCart = function(id) {
    const existing = CART.find(c => c.id === id);
    if (existing) existing.qty += 1;
    else CART.push({ id, qty: 1 });
    saveCart();
    renderGrid(document.getElementById("search").value);
  };

  window.changeQty = function(id, delta) {
    const item = CART.find(c => c.id === id);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) CART = CART.filter(c => c.id !== id);
    saveCart();
    renderGrid(document.getElementById("search").value);
  };

  function saveCart() {
    localStorage.setItem("cart", JSON.stringify(CART));
    const count = CART.reduce((s, c) => s + c.qty, 0);
    document.getElementById("cart-count").textContent = count;
    renderCart();
    renderStickyBar();
  }

  function cartDetails() {
    return CART.map(c => {
      const p = PRODUCTS.find(p => p.id === c.id);
      return p ? { ...p, qty: c.qty } : null;
    }).filter(Boolean);
  }

  function renderStickyBar() {
    const bar = document.getElementById("sticky-bar");
    const details = cartDetails();
    if (!details.length) { bar.classList.remove("show"); return; }
    const total = details.reduce((s, p) => s + p.price * p.qty, 0);
    const count = details.reduce((s, p) => s + p.qty, 0);
    document.getElementById("sticky-count").textContent = `${count} item${count > 1 ? "s" : ""}`;
    document.getElementById("sticky-total").textContent = `${CURRENCY} ${total.toLocaleString()}`;
    bar.classList.add("show");
  }

  function renderCart() {
    const list = document.getElementById("cart-list");
    const details = cartDetails();
    if (!details.length) {
      list.innerHTML = `<p class="empty">Cart is empty.</p>`;
      document.getElementById("cart-total").textContent = "";
      document.getElementById("checkout-btn").disabled = true;
      return;
    }
    document.getElementById("checkout-btn").disabled = false;
    let total = 0;
    list.innerHTML = details.map(p => {
      const line = p.price * p.qty;
      total += line;
      return `
        <div class="cart-row">
          <img src="${p.image || 'https://placehold.co/80x80?text=No+Image'}" alt="${p.name}">
          <div class="cart-row-info">
            <span>${p.name}</span>
            <span class="muted">${CURRENCY} ${p.price.toLocaleString()} × ${p.qty}</span>
          </div>
          <div class="qty-ctrl">
            <button onclick="changeQty('${p.id}',-1)">−</button>
            <span>${p.qty}</span>
            <button onclick="changeQty('${p.id}',1)">+</button>
          </div>
        </div>`;
    }).join("");
    document.getElementById("cart-total").textContent = `${CURRENCY} ${total.toLocaleString()}`;
  }

  window.openCart = function() {
    document.getElementById('cart-panel').classList.add('open');
    document.getElementById('overlay').classList.add('open');
  };
  window.closeCart = function() {
    document.getElementById('cart-panel').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  };

  window.submitOrder = async function(e) {
    e.preventDefault();
    const name = document.getElementById("f-name").value.trim();
    const phone = document.getElementById("f-phone").value.trim();
    const address = document.getElementById("f-address").value.trim();
    const payment = document.querySelector('input[name="payment"]:checked').value;
    const details = cartDetails();
    if (!details.length) return;
    const total = details.reduce((s, p) => s + p.price * p.qty, 0);

    const submitBtn = document.getElementById("place-order-btn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Placing order...";

    try {
      await addDoc(collection(db, "orders"), {
        customerName: name,
        phone,
        address,
        payment,
        items: details.map(p => ({ id: p.id, name: p.name, price: p.price, qty: p.qty })),
        total,
        status: "pending",
        createdAt: serverTimestamp()
      });
    } catch (err) {
      console.error(err);
      submitBtn.disabled = false;
      submitBtn.textContent = "Place Order";
      alert("Order could not be sent. Please check your internet connection and try again.");
      return;
    }

    CART = [];
    saveCart();
    document.getElementById("checkout-form").reset();
    submitBtn.disabled = false;
    submitBtn.textContent = "Place Order";
    closeCheckout();
    closeCart();
    showConfirmation(payment, total);
    renderGrid(document.getElementById("search").value);
  };

  function showConfirmation(payment, total) {
    const modal = document.getElementById("confirm-modal");
    const body = document.getElementById("confirm-body");
    const paymentNote = payment === "online"
      ? `<p class="receipt-note">Please pay <strong>${CURRENCY} ${total.toLocaleString()}</strong> to:<br>JazzCash: ${JAZZCASH_NUMBER}<br>Easypaisa: ${EASYPAISA_NUMBER}</p>`
      : `<p class="receipt-note">Pay <strong>${CURRENCY} ${total.toLocaleString()}</strong> in cash on delivery.</p>`;
    body.innerHTML = `<div class="confirm-icon">✓</div><h2>Order placed</h2><p>We've received your order and will confirm it shortly.</p>${paymentNote}`;
    modal.classList.add("open");
  }
  window.closeConfirm = function() { document.getElementById("confirm-modal").classList.remove("open"); };
  window.closeCheckout = function() { document.getElementById('checkout-modal').classList.remove('open'); };
  window.openCheckout = function() {
    document.getElementById('checkout-modal').classList.add('open');
  };

  window.addEventListener("DOMContentLoaded", () => {
    document.getElementById("store-name").textContent = STORE_NAME;
    document.getElementById("hero-title").textContent = STORE_NAME;
    document.getElementById("footer-name").textContent = STORE_NAME;
    document.title = STORE_NAME;
    loadProducts();
    saveCart();
    document.getElementById("search").addEventListener("input", (e) => renderGrid(e.target.value));
  });
</script>

<style>
  :root {
    --grad: linear-gradient(135deg, #1D4ED8 0%, #2563EB 60%, #0EA5E9 100%);
    --violet: #2563EB;
    --violet-deep: #1E3A8A;
    --accent: #F97316;
    --ink: #111827;
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --line: #E2E8F0;
    --muted: #64748B;
    --success: #16A34A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); }
  h1, h2, h3, .brand { font-family: 'Plus Jakarta Sans', sans-serif; }

  header {
    background: var(--surface);
    padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid var(--line);
  }
  .brand { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  #cart-btn {
    background: var(--grad); color: white; border: none;
    border-radius: 999px; padding: 9px 16px; font-weight: 700; font-family: 'Inter';
    cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px;
  }
  #cart-count {
    background: rgba(255,255,255,0.25); border-radius: 999px; padding: 1px 7px; font-size: 11px;
  }

  .hero {
    background: var(--grad);
    color: white;
    padding: 34px 20px 26px; text-align: center;
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 20% 0%, rgba(255,255,255,0.18), transparent 55%);
  }
  .hero-eyebrow {
    display: inline-block; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    opacity: 0.85; font-weight: 700; margin-bottom: 6px; position: relative;
  }
  .hero h1 { font-size: 27px; margin: 0 0 6px; font-weight: 800; position: relative; }
  .hero p { margin: 0 0 18px; opacity: 0.9; font-size: 13.5px; position: relative; }
  #search {
    width: 100%; max-width: 420px; padding: 13px 18px; border-radius: 999px;
    border: none; font-family: 'Inter'; font-size: 14.5px; position: relative;
    box-shadow: 0 10px 24px rgba(29,78,216,0.25);
  }

  .category-bar {
    display: flex; gap: 8px; overflow-x: auto; padding: 16px 16px 6px; max-width: 1100px; margin: 0 auto;
    scrollbar-width: none;
  }
  .category-bar::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line);
    background: white; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink);
  }
  .chip.active { background: var(--violet); color: white; border-color: var(--violet); }

  #grid {
    max-width: 1100px; margin: 0 auto; padding: 16px 14px 110px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px;
  }
  .card {
    background: white; border-radius: 18px; overflow: hidden; position: relative;
    box-shadow: 0 2px 10px rgba(29,78,216,0.08); display: flex; flex-direction: column;
    transition: transform 0.15s;
  }
  .card:active { transform: scale(0.97); }
  .tag {
    position: absolute; top: 9px; left: 9px; font-size: 10.5px; font-weight: 800;
    padding: 4px 9px; border-radius: 999px; z-index: 2; letter-spacing: 0.02em;
  }
  .tag.out { background: #4B4B4B; color: white; }
  .tag.badge { background: var(--grad); color: white; }
  .thumb { aspect-ratio: 1; background: #EFF6FF; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-body { padding: 12px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .card-body h3 { font-size: 13.5px; margin: 0; line-height: 1.3; font-weight: 700; }
  .desc { font-size: 11.5px; color: var(--muted); margin: 0; flex: 1; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; gap: 6px; }
  .price { font-weight: 800; font-size: 14px; color: var(--violet-deep); }
  .add-btn {
    background: var(--violet); color: white; border: none; border-radius: 10px;
    padding: 7px 14px; font-weight: 700; font-size: 12.5px; cursor: pointer;
  }
  .add-btn:disabled { background: #ddd; color: #999; cursor: not-allowed; }
  .stepper {
    display: flex; align-items: center; gap: 8px; background: var(--bg);
    border-radius: 10px; padding: 3px 6px;
  }
  .stepper button {
    width: 22px; height: 22px; border-radius: 6px; border: none; background: var(--violet);
    color: white; font-size: 15px; cursor: pointer; line-height: 1;
  }
  .stepper span { font-size: 13px; font-weight: 700; min-width: 14px; text-align: center; }
  .empty { text-align: center; color: var(--muted); grid-column: 1/-1; padding: 40px 0; }

  #sticky-bar {
    position: fixed; left: 14px; right: 14px; bottom: -100px; z-index: 25;
    background: var(--grad); border-radius: 16px; padding: 13px 16px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 10px 28px rgba(29,78,216,0.35); transition: bottom 0.3s ease; color: white;
  }
  #sticky-bar.show { bottom: 16px; }
  #sticky-bar .info { display: flex; flex-direction: column; }
  #sticky-bar .info span:first-child { font-size: 11px; opacity: 0.85; }
  #sticky-bar .info span:last-child { font-size: 15px; font-weight: 800; }
  #sticky-bar button {
    background: white; color: var(--violet-deep); border: none; border-radius: 10px;
    padding: 10px 18px; font-weight: 800; font-size: 13.5px; cursor: pointer;
  }

  #cart-panel {
    position: fixed; top: 0; right: -100%; width: 100%; max-width: 380px; height: 100%;
    background: var(--bg); box-shadow: -4px 0 24px rgba(0,0,0,0.15);
    transition: right 0.3s ease; z-index: 30; display: flex; flex-direction: column;
  }
  #cart-panel.open { right: 0; }
  .cart-header {
    background: var(--grad); color: white; padding: 18px 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .cart-header button { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
  #cart-list { flex: 1; overflow-y: auto; padding: 14px; }
  .cart-row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .cart-row img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; }
  .cart-row-info { flex: 1; display: flex; flex-direction: column; font-size: 13px; }
  .muted { color: var(--muted); font-size: 12px; }
  .qty-ctrl { display: flex; align-items: center; gap: 8px; }
  .qty-ctrl button {
    width: 26px; height: 26px; border-radius: 8px; border: none;
    background: var(--violet); color: white; cursor: pointer; font-size: 15px;
  }
  .cart-footer { padding: 16px 20px; border-top: 1px solid var(--line); background: white; }
  .cart-total-row { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 12px; }
  #checkout-btn, #place-order-btn {
    width: 100%; padding: 14px; background: var(--grad); color: white;
    border: none; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; font-family: 'Inter';
  }
  #checkout-btn:disabled { background: #ddd; color: #999; cursor: not-allowed; }

  #overlay {
    display: none; position: fixed; inset: 0; background: rgba(17,24,39,0.5); z-index: 20;
  }
  #overlay.open { display: block; }

  #checkout-modal, #confirm-modal {
    display: none; position: fixed; inset: 0; z-index: 40; align-items: flex-end; justify-content: center;
    background: rgba(17,24,39,0.55);
  }
  #checkout-modal.open, #confirm-modal.open { display: flex; }
  .sheet {
    background: white; width: 100%; max-width: 480px; border-radius: 22px 22px 0 0;
    padding: 22px 20px 30px; max-height: 88vh; overflow-y: auto;
  }
  .sheet h2 { margin: 0 0 4px; font-size: 20px; }
  .receipt-note { font-size: 13px; color: var(--muted); margin: 0 0 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .field input, .field textarea {
    width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line);
    font-family: 'Inter'; font-size: 14px; background: var(--bg);
  }
  .pay-options { display: flex; gap: 10px; margin-bottom: 16px; }
  .pay-option {
    flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 10px;
    cursor: pointer; text-align: center; font-size: 12.5px; font-weight: 700;
  }
  .pay-option input { margin-right: 5px; }
  .close-x { background: none; border: none; font-size: 20px; float: right; cursor: pointer; color: var(--muted); }

  #confirm-body { text-align: center; }
  .confirm-icon {
    width: 56px; height: 56px; border-radius: 50%; background: var(--success); color: white;
    display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800;
    margin: 0 auto 14px;
  }
  #confirm-body h2 { margin: 0 0 6px; }
  #confirm-body p { font-size: 14px; margin: 0 0 6px; color: var(--muted); }

  .site-footer {
    text-align: center; padding: 24px 20px 120px; color: var(--muted);
  }
  .site-footer .brand { font-size: 15px; color: var(--ink); margin-bottom: 4px; }
  .site-footer p { font-size: 11.5px; margin: 0; }

  @media (min-width: 700px) {
    #checkout-modal, #confirm-modal { align-items: center; }
    .sheet { border-radius: 20px; }
  }
</style>
</head>
<body>

<header>
  <span class="brand" id="store-name">Store</span>
  <button id="cart-btn" onclick="openCart()">
    🛍️ Cart <span id="cart-count">0</span>
  </button>
</header>

<div class="hero">
  <span class="hero-eyebrow">Welcome to</span>
  <h1 id="hero-title">Store</h1>
  <p>Quality products, fast delivery across Pakistan</p>
  <input id="search" type="text" placeholder="Search products...">
</div>

<div id="category-bar" class="category-bar"></div>

<div id="grid"><p class="empty">Loading products...</p></div>

<footer class="site-footer">
  <div class="brand" id="footer-name">Store</div>
  <p>Cash on Delivery &amp; Online Payment available</p>
</footer>

<div id="sticky-bar">
  <div class="info">
    <span id="sticky-count">0 items</span>
    <span id="sticky-total">Rs. 0</span>
  </div>
  <button onclick="openCart()">View Cart</button>
</div>

<div id="overlay" onclick="closeCart()"></div>

<div id="cart-panel">
  <div class="cart-header">
    <span>Your Cart</span>
    <button onclick="closeCart()">✕</button>
  </div>
  <div id="cart-list"><p class="empty">Cart is empty.</p></div>
  <div class="cart-footer">
    <div class="cart-total-row"><span>Total</span><span id="cart-total"></span></div>
    <button id="checkout-btn" disabled onclick="openCheckout()">Checkout</button>
  </div>
</div>

<div id="checkout-modal">
  <div class="sheet">
    <button class="close-x" onclick="closeCheckout()">✕</button>
    <h2>Complete your order</h2>
    <p class="receipt-note">We'll confirm your order shortly.</p>
    <form id="checkout-form" onsubmit="submitOrder(event)">
      <div class="field"><label>Full name</label><input id="f-name" required></div>
      <div class="field"><label>Phone number</label><input id="f-phone" type="tel" required></div>
      <div class="field"><label>Delivery address</label><textarea id="f-address" rows="2" required></textarea></div>
      <div class="field">
        <label>Payment method</label>
        <div class="pay-options">
          <label class="pay-option"><input type="radio" name="payment" value="cod" checked> Cash on Delivery</label>
          <label class="pay-option"><input type="radio" name="payment" value="online"> Online (JazzCash/Easypaisa)</label>
        </div>
      </div>
      <button id="place-order-btn" type="submit">Place Order</button>
    </form>
  </div>
</div>

<div id="confirm-modal">
  <div class="sheet">
    <button class="close-x" onclick="closeConfirm()">✕</button>
    <div id="confirm-body"></div>
  </div>
</div>

</body>
</html>
