<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Store</title>

<script>
  const STORE_NAME = "Bahoo Traders"; // keep same as index.html
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, orderBy, query, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ================================================
  // SAME FIREBASE CONFIG AS index.html — paste it here too
  // ================================================
  const firebaseConfig = {
    apiKey: "AIzaSyAIlG297vfNbYFwjEfmtdgKfoJef1d-22w",
    authDomain: "bahoo-traders.firebaseapp.com",
    projectId: "bahoo-traders",
    storageBucket: "bahoo-traders.firebasestorage.app",
    messagingSenderId: "465050348956",
    appId: "1:465050348956:web:b368133cd5756371cbec59"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let editingId = null;

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("admin-screen").style.display = "block";
      document.getElementById("who").textContent = user.email;
      loadProducts();
      startOrderListener();
    } else {
      document.getElementById("login-screen").style.display = "flex";
      document.getElementById("admin-screen").style.display = "none";
    }
  });

  window.doLogin = async function(e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("password").value;
    const errEl = document.getElementById("login-error");
    errEl.textContent = "";
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (err) {
      errEl.textContent = "Login failed — check email/password.";
    }
  };

  window.doLogout = function() { signOut(auth); };

  window.switchTab = function(tab) {
    document.querySelectorAll(".tab-panel").forEach(el => el.style.display = "none");
    document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
    document.getElementById("tab-" + tab).style.display = "block";
    document.getElementById("btn-" + tab).classList.add("active");
    if (tab === "orders") setTimeout(markOrdersSeen, 800);
  };

  async function loadProducts() {
    const list = document.getElementById("product-list");
    list.innerHTML = "Loading...";
    const snap = await getDocs(collection(db, "products"));
    const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!items.length) { list.innerHTML = `<p class="empty">No products yet — add your first one below.</p>`; return; }
    list.innerHTML = items.map(p => `
      <div class="prod-row">
        <img src="${p.image || 'https://placehold.co/60x60?text=No+Img'}">
        <div class="prod-info">
          <strong>${p.name}</strong>
          <span class="muted">Rs. ${Number(p.price||0).toLocaleString()} · stock: ${p.stock ?? "—"}</span>
        </div>
        <button class="edit-btn" onclick='editProduct(${JSON.stringify(p).replace(/'/g, "&apos;")})'>Edit</button>
        <button class="del-btn" onclick="deleteProduct('${p.id}')">Delete</button>
      </div>
    `).join("");
  }

  window.editProduct = function(p) {
    editingId = p.id;
    document.getElementById("p-name").value = p.name || "";
    document.getElementById("p-price").value = p.price || "";
    document.getElementById("p-stock").value = p.stock ?? "";
    document.getElementById("p-image").value = p.image || "";
    document.getElementById("p-desc").value = p.description || "";
    document.getElementById("form-title").textContent = "Edit product";
    document.getElementById("cancel-edit").style.display = "inline-block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  window.cancelEdit = function() {
    editingId = null;
    document.getElementById("product-form").reset();
    document.getElementById("form-title").textContent = "Add product";
    document.getElementById("cancel-edit").style.display = "none";
  };

  window.saveProduct = async function(e) {
    e.preventDefault();
    const data = {
      name: document.getElementById("p-name").value.trim(),
      price: Number(document.getElementById("p-price").value),
      stock: document.getElementById("p-stock").value === "" ? null : Number(document.getElementById("p-stock").value),
      image: document.getElementById("p-image").value.trim(),
      description: document.getElementById("p-desc").value.trim(),
    };
    if (editingId) {
      await updateDoc(doc(db, "products", editingId), data);
    } else {
      await addDoc(collection(db, "products"), data);
    }
    cancelEdit();
    loadProducts();
  };

  window.deleteProduct = async function(id) {
    if (!confirm("Delete this product?")) return;
    await deleteDoc(doc(db, "products", id));
    loadProducts();
  };

  let seenOrderIds = JSON.parse(localStorage.getItem("seenOrderIds") || "[]");
  let firstSnapshot = true;

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.18);
    } catch {}
  }

  function showToast(text) {
    const toast = document.createElement("div");
    toast.className = "order-toast";
    toast.textContent = text;
    document.body.appendChild(toast);
    setTimeout(() => toast.classList.add("show"), 10);
    setTimeout(() => { toast.classList.remove("show"); setTimeout(() => toast.remove(), 300); }, 4500);
  }

  function updateBadge(count) {
    const badge = document.getElementById("orders-badge");
    if (count > 0) { badge.textContent = count; badge.style.display = "inline-flex"; }
    else { badge.style.display = "none"; }
  }

  function startOrderListener() {
    let q;
    try { q = query(collection(db, "orders"), orderBy("createdAt", "desc")); }
    catch { q = collection(db, "orders"); }

    onSnapshot(q, (snap) => {
      const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderOrders(items);

      if (!firstSnapshot) {
        const newOnes = items.filter(o => !seenOrderIds.includes(o.id));
        newOnes.forEach(o => {
          showToast(`🔔 New order from ${o.customerName || "customer"} — Rs. ${Number(o.total||0).toLocaleString()}`);
        });
        if (newOnes.length) beep();
      } else {
        firstSnapshot = false;
      }

      const unreadCount = items.filter(o => !seenOrderIds.includes(o.id)).length;
      updateBadge(unreadCount);
    });
  }

  let lastOrders = [];
  function renderOrders(items) {
    lastOrders = items;
    const list = document.getElementById("order-list");
    if (!items.length) { list.innerHTML = `<p class="empty">No orders yet.</p>`; return; }
    list.innerHTML = items.map(o => `
      <div class="order-card ${!seenOrderIds.includes(o.id) ? "unread" : ""}">
        <div class="order-top">
          <strong>${o.customerName || "—"}</strong>
          <span class="status-badge ${o.status || 'pending'}">${o.status || "pending"}</span>
        </div>
        <div class="muted">${o.phone || ""} · ${o.address || ""}</div>
        <div class="order-items">
          ${(o.items||[]).map(it => `<span>${it.name} ×${it.qty}</span>`).join(", ")}
        </div>
        <div class="order-bottom">
          <span>Total: Rs. ${Number(o.total||0).toLocaleString()} · ${o.payment === "online" ? "Online" : "COD"}</span>
          <select onchange="updateStatus('${o.id}', this.value)">
            <option value="pending" ${o.status==="pending"?"selected":""}>Pending</option>
            <option value="confirmed" ${o.status==="confirmed"?"selected":""}>Confirmed</option>
            <option value="delivered" ${o.status==="delivered"?"selected":""}>Delivered</option>
          </select>
        </div>
      </div>
    `).join("");
  }

  window.updateStatus = async function(id, status) {
    await updateDoc(doc(db, "orders", id), { status });
  };

  window.markOrdersSeen = function() {
    seenOrderIds = Array.from(new Set([...seenOrderIds, ...lastOrders.map(o => o.id)]));
    localStorage.setItem("seenOrderIds", JSON.stringify(seenOrderIds));
    updateBadge(0);
    renderOrders(lastOrders);
  };

  window.addEventListener("DOMContentLoaded", () => {
    document.title = STORE_NAME + " — Admin";
  });
</script>

<style>
  :root {
    --ink: #10241F; --teal: #0E4B45; --teal-deep: #0A3733;
    --saffron: #E9A23B; --cream: #FAF3E7; --coral: #D65A46; --line: #E4D9C3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--cream); color: var(--ink); }
  h1, h2, .brand { font-family: 'Space Grotesk', sans-serif; }

  #login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--teal-deep);
  }
  .login-card { background: white; padding: 32px 26px; border-radius: 16px; width: 100%; max-width: 340px; }
  .login-card h1 { font-size: 20px; margin: 0 0 4px; }
  .login-card p { color: #8a8375; font-size: 13px; margin: 0 0 20px; }
  .login-card input {
    width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 9px; border: 1px solid var(--line);
    font-family: 'Inter'; font-size: 14px; background: var(--cream);
  }
  .login-card button {
    width: 100%; padding: 12px; background: var(--saffron); color: var(--teal-deep); border: none;
    border-radius: 9px; font-weight: 700; cursor: pointer; font-size: 14px;
  }
  .error-text { color: var(--coral); font-size: 12px; margin-top: 8px; }

  header {
    background: var(--teal); color: white; padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 5;
  }
  header .brand { font-size: 18px; font-weight: 700; }
  header button { background: none; border: 1px solid rgba(255,255,255,0.4); color: white; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }

  .tabs { display: flex; gap: 8px; padding: 16px 20px 0; max-width: 640px; margin: 0 auto; }
  .tab-btn {
    flex: 1; padding: 10px; border: none; background: white; border-radius: 10px 10px 0 0;
    font-weight: 600; font-size: 13px; cursor: pointer; opacity: 0.5;
  }
  .tab-btn.active { opacity: 1; background: var(--cream); border-bottom: 3px solid var(--saffron); }

  main { max-width: 640px; margin: 0 auto; padding: 0 20px 60px; }
  .tab-panel { display: none; }

  #product-form { background: white; border-radius: 14px; padding: 18px; margin-bottom: 20px; border: 1px solid var(--line); }
  #product-form h3 { margin: 0 0 12px; font-size: 15px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .field input, .field textarea {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
    font-family: 'Inter'; font-size: 14px; background: var(--cream);
  }
  .form-row { display: flex; gap: 10px; }
  .form-row .field { flex: 1; }
  .form-actions { display: flex; gap: 10px; margin-top: 4px; }
  .form-actions button {
    padding: 10px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 13px;
  }
  #save-btn { background: var(--teal); color: white; }
  #cancel-edit { background: #eee; display: none; }

  .prod-row, .order-card {
    background: white; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--line);
  }
  .prod-row { display: flex; align-items: center; gap: 10px; }
  .prod-row img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
  .prod-info { flex: 1; display: flex; flex-direction: column; font-size: 13px; }
  .muted { color: #8a8375; font-size: 12px; }
  .edit-btn, .del-btn { border: none; border-radius: 7px; padding: 7px 10px; font-size: 12px; cursor: pointer; font-weight: 600; }
  .edit-btn { background: var(--saffron); color: var(--teal-deep); }
  .del-btn { background: var(--coral); color: white; margin-left: 6px; }

  .order-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .status-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; text-transform: capitalize; }
  .status-badge.pending { background: #FBE7C6; color: #8a5a00; }
  .status-badge.confirmed { background: #D6E9E0; color: #0E4B45; }
  .status-badge.delivered { background: #D8E8D0; color: #33691e; }
  .order-items { font-size: 13px; margin: 6px 0; }
  .order-bottom { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-top: 6px; }
  .order-bottom select { border-radius: 6px; border: 1px solid var(--line); padding: 4px 6px; font-size: 12px; }
  .empty { text-align: center; color: #9a9384; padding: 30px 0; }

  .badge-count {
    display: none; align-items: center; justify-content: center;
    background: var(--coral); color: white; font-size: 11px; font-weight: 700;
    min-width: 18px; height: 18px; border-radius: 999px; padding: 0 5px; margin-left: 4px;
  }
  .order-card.unread { border: 1px solid var(--saffron); box-shadow: 0 0 0 3px rgba(233,162,59,0.15); }

  .order-toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--teal-deep); color: white; padding: 12px 18px; border-radius: 12px;
    font-size: 13px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 50;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25); max-width: 90%; text-align: center;
  }
  .order-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>Admin login</h1>
    <p id="store-label">Manage products & orders</p>
    <form onsubmit="doLogin(event)">
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>
    <div id="login-error" class="error-text"></div>
  </div>
</div>

<div id="admin-screen" style="display:none;">
  <header>
    <span class="brand">Admin</span>
    <div style="display:flex; align-items:center; gap:10px;">
      <span id="who" style="font-size:12px; opacity:0.8;"></span>
      <button onclick="doLogout()">Log out</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="btn-products" onclick="switchTab('products')">Products</button>
    <button class="tab-btn" id="btn-orders" onclick="switchTab('orders')">Orders <span id="orders-badge" class="badge-count"></span></button>
  </div>

  <main>
    <div class="tab-panel" id="tab-products" style="display:block;">
      <form id="product-form" onsubmit="saveProduct(event)">
        <h3 id="form-title">Add product</h3>
        <div class="field"><label>Name</label><input id="p-name" required></div>
        <div class="form-row">
          <div class="field"><label>Price (Rs.)</label><input id="p-price" type="number" required></div>
          <div class="field"><label>Stock (optional)</label><input id="p-stock" type="number"></div>
        </div>
        <div class="field"><label>Image URL</label><input id="p-image" placeholder="https://..."></div>
        <div class="field"><label>Description</label><textarea id="p-desc" rows="2"></textarea></div>
        <div class="form-actions">
          <button type="submit" id="save-btn">Save product</button>
          <button type="button" id="cancel-edit" onclick="cancelEdit()">Cancel edit</button>
        </div>
      </form>
      <div id="product-list"></div>
    </div>

    <div class="tab-panel" id="tab-orders">
      <div id="order-list"></div>
    </div>
  </main>
</div>

</body>
</html>
