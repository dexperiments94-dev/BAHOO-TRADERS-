<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Store</title>

<script>
  const STORE_NAME = "Bahoo Traders"; // keep same as index.html
  const IMGBB_API_KEY = "47cbb116d1ac66b4b6af89755bb8db74"; // from api.imgbb.com
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, getDoc, setDoc, orderBy, query, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ================================================
  // SAME FIREBASE CONFIG AS index.html — paste it here too
  // ================================================
  const firebaseConfig = {
    apiKey: "AIzaSyAIlG297vfNbYFwjEfmtdgKfoJef1d-22w",
    authDomain: "bahoo-traders.firebaseapp.com",
    projectId: "bahoo-traders",
    storageBucket: "bahoo-traders.firebasestorage.app",
    messagingSenderId: "465050348956",
    appId: "1:465050348956:web:b368133cd5756371cbec59"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let editingId = null;
  let currentImages = [];
  const STATUS_LABELS = {
    pending: "Pending", confirmed: "Confirmed", shipped: "Shipped",
    out_for_delivery: "Out for Delivery", delivered: "Delivered"
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("admin-screen").style.display = "block";
      document.getElementById("who").textContent = user.email;
      loadProducts();
      loadSettings();
      startOrderListener();
    } else {
      document.getElementById("login-screen").style.display = "flex";
      document.getElementById("admin-screen").style.display = "none";
    }
  });

  window.doLogin = async function(e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("password").value;
    const errEl = document.getElementById("login-error");
    errEl.textContent = "";
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (err) {
      errEl.textContent = "Login failed — check email/password.";
    }
  };

  window.doLogout = function() { signOut(auth); };

  window.switchTab = function(tab) {
    document.querySelectorAll(".tab-panel").forEach(el => el.style.display = "none");
    document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
    document.getElementById("tab-" + tab).style.display = "block";
    document.getElementById("btn-" + tab).classList.add("active");
    if (tab === "orders") setTimeout(markOrdersSeen, 800);
  };

  async function loadSettings() {
    try {
      const snap = await getDoc(doc(db, "settings", "site"));
      if (snap.exists()) {
        const s = snap.data();
        document.getElementById("s-storename").value = s.storeName || "";
        document.getElementById("s-marquee").value = s.marqueeText || "";
        document.getElementById("s-contact").value = s.contactNumber || "";
        document.getElementById("s-email").value = s.contactEmail || "";
        document.getElementById("s-shipping").value = s.shippingFee ?? "";
        document.getElementById("s-jazzcash").value = s.jazzcashNumber || "";
        document.getElementById("s-easypaisa").value = s.easypaisaNumber || "";
      }
    } catch (e) { console.error(e); }
  }

  window.saveSettings = async function(e) {
    e.preventDefault();
    const status = document.getElementById("settings-status");
    status.textContent = "Saving...";
    try {
      await setDoc(doc(db, "settings", "site"), {
        storeName: document.getElementById("s-storename").value.trim(),
        marqueeText: document.getElementById("s-marquee").value.trim(),
        contactNumber: document.getElementById("s-contact").value.trim(),
        contactEmail: document.getElementById("s-email").value.trim(),
        shippingFee: document.getElementById("s-shipping").value === "" ? 0 : Number(document.getElementById("s-shipping").value),
        jazzcashNumber: document.getElementById("s-jazzcash").value.trim(),
        easypaisaNumber: document.getElementById("s-easypaisa").value.trim(),
      }, { merge: true });
      status.textContent = "Saved ✓";
      setTimeout(() => status.textContent = "", 2000);
    } catch (err) {
      console.error(err);
      status.textContent = "Failed to save — try again.";
    }
  };

  let allProducts = [];

  async function loadProducts() {
    const list = document.getElementById("product-list");
    list.innerHTML = "Loading...";
    const snap = await getDocs(collection(db, "products"));
    allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderProductList(document.getElementById("product-search")?.value || "");
  }

  window.renderProductList = function(filter = "") {
    const list = document.getElementById("product-list");
    const f = filter.trim().toLowerCase();
    const items = !f ? allProducts : allProducts.filter(p =>
      (p.sku || "").toLowerCase().includes(f) || (p.name || "").toLowerCase().includes(f)
    );
    if (!allProducts.length) { list.innerHTML = `<p class="empty">No products yet — add your first one.</p>`; return; }
    if (!items.length) { list.innerHTML = `<p class="empty">No products match "${filter}".</p>`; return; }
    list.innerHTML = items.map(p => `
      <div class="prod-row">
        <img src="${p.image || 'https://placehold.co/60x60?text=No+Img'}">
        <div class="prod-info">
          <strong>${p.name}</strong>
          <span class="muted">${p.sku ? `SKU: ${p.sku} · ` : ""}Rs. ${Number(p.price||0).toLocaleString()}${p.comparePrice ? ` <s>Rs. ${Number(p.comparePrice).toLocaleString()}</s>` : ""} · stock: ${p.stock ?? "—"}</span>
        </div>
        <button class="edit-btn" onclick='editProduct(${JSON.stringify(p).replace(/'/g, "&apos;")})'>Edit</button>
        <button class="del-btn" onclick="deleteProduct('${p.id}')">Delete</button>
      </div>
    `).join("");
  };

  window.editProduct = function(p) {
    editingId = p.id;
    document.getElementById("p-name").value = p.name || "";
    document.getElementById("p-sku").value = p.sku || "";
    document.getElementById("p-price").value = p.price || "";
    document.getElementById("p-compare").value = p.comparePrice ?? "";
    document.getElementById("p-stock").value = p.stock ?? "";
    document.getElementById("p-desc").value = p.description || "";
    document.getElementById("p-category").value = p.category || "";
    document.getElementById("p-badge").value = p.badge || "";
    currentImages = (p.images && p.images.length) ? [...p.images] : (p.image ? [p.image] : []);
    renderImagePreviews();
    document.getElementById("form-title").textContent = "Edit product";
    document.getElementById("cancel-edit").style.display = "inline-block";
    switchTab("add");
  };

  window.cancelEdit = function() {
    editingId = null;
    document.getElementById("product-form").reset();
    document.getElementById("form-title").textContent = "Add product";
    document.getElementById("cancel-edit").style.display = "none";
    currentImages = [];
    renderImagePreviews();
    document.getElementById("upload-status").textContent = "";
  };

  function renderImagePreviews() {
    const wrap = document.getElementById("p-image-previews");
    wrap.innerHTML = currentImages.map((url, i) => `
      <div style="position:relative; width:70px; height:70px;">
        <img src="${url}" style="width:70px; height:70px; object-fit:cover; border-radius:8px; ${i===0 ? 'outline:2px solid #4a8;' : ''}">
        <button type="button" onclick="removeImage(${i})" style="position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; border:none; background:#e11; color:white; cursor:pointer; font-size:12px; line-height:1;">×</button>
        ${i===0 ? '<span style="position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.6); color:white; font-size:9px; text-align:center; border-radius:0 0 8px 8px;">Main</span>' : ''}
      </div>
    `).join("");
  }

  window.removeImage = function(i) {
    currentImages.splice(i, 1);
    renderImagePreviews();
  };

  window.saveProduct = async function(e) {
    e.preventDefault();
    if (!currentImages.length) {
      alert("Please add at least 1 product photo.");
      return;
    }
    const data = {
      name: document.getElementById("p-name").value.trim(),
      sku: document.getElementById("p-sku").value.trim(),
      price: Number(document.getElementById("p-price").value),
      comparePrice: document.getElementById("p-compare").value === "" ? null : Number(document.getElementById("p-compare").value),
      stock: Number(document.getElementById("p-stock").value),
      images: currentImages,
      image: currentImages[0],
      description: document.getElementById("p-desc").value.trim(),
      category: document.getElementById("p-category").value.trim(),
      badge: document.getElementById("p-badge").value.trim(),
    };
    if (editingId) {
      await updateDoc(doc(db, "products", editingId), data);
    } else {
      await addDoc(collection(db, "products"), data);
    }
    cancelEdit();
    await loadProducts();
    switchTab("products");
  };

  window.handleImageUpload = async function(e) {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    const status = document.getElementById("upload-status");
    const remaining = 10 - currentImages.length;
    if (remaining <= 0) {
      status.textContent = "Max 10 photos reached.";
      e.target.value = "";
      return;
    }
    const toUpload = files.slice(0, remaining);
    let done = 0;
    status.textContent = `Uploading 0/${toUpload.length}...`;
    for (const file of toUpload) {
      try {
        const formData = new FormData();
        formData.append("image", file);
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });
        const result = await res.json();
        if (result.success) {
          currentImages.push(result.data.url);
          renderImagePreviews();
        }
        done++;
        status.textContent = `Uploading ${done}/${toUpload.length}...`;
      } catch (err) {
        done++;
      }
    }
    status.textContent = `Uploaded ✓ (${currentImages.length}/10)`;
    e.target.value = "";
  };

  window.deleteProduct = async function(id) {
    if (!confirm("Delete this product?")) return;
    await deleteDoc(doc(db, "products", id));
    loadProducts();
  };

  let seenOrderIds = JSON.parse(localStorage.getItem("seenOrderIds") || "[]");
  let firstSnapshot = true;

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.18);
    } catch {}
  }

  function showToast(text) {
    const toast = document.createElement("div");
    toast.className = "order-toast";
    toast.textContent = text;
    document.body.appendChild(toast);
    setTimeout(() => toast.classList.add("show"), 10);
    setTimeout(() => { toast.classList.remove("show"); setTimeout(() => toast.remove(), 300); }, 4500);
  }

  function updateBadge(count) {
    const badge = document.getElementById("orders-badge");
    if (count > 0) { badge.textContent = count; badge.style.display = "inline-flex"; }
    else { badge.style.display = "none"; }
  }

  function startOrderListener() {
    let q;
    try { q = query(collection(db, "orders"), orderBy("createdAt", "desc")); }
    catch { q = collection(db, "orders"); }

    onSnapshot(q, (snap) => {
      const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderOrders(items);

      if (!firstSnapshot) {
        const newOnes = items.filter(o => !seenOrderIds.includes(o.id));
        newOnes.forEach(o => {
          showToast(`🔔 New order from ${o.customerName || "customer"} — Rs. ${Number(o.total||0).toLocaleString()}`);
        });
        if (newOnes.length) beep();
      } else {
        firstSnapshot = false;
      }

      const unreadCount = items.filter(o => !seenOrderIds.includes(o.id)).length;
      updateBadge(unreadCount);
    });
  }

  let lastOrders = [];
  let expandedOrders = new Set();
  function paymentLabel(p) {
    if (p === "jazzcash") return "JazzCash";
    if (p === "easypaisa") return "Easypaisa";
    if (p === "online") return "Online"; // legacy orders
    return "Cash on Delivery";
  }
  function renderOrders(items) {
    lastOrders = items;
    const list = document.getElementById("order-list");
    if (!items.length) { list.innerHTML = `<p class="empty">No orders yet.</p>`; return; }
    list.innerHTML = items.map(o => {
      const isOpen = expandedOrders.has(o.id);
      return `
      <div class="order-card ${!seenOrderIds.includes(o.id) ? "unread" : ""}">
        <div class="order-top">
          <strong>${o.customerName || "—"}</strong>
          <span class="status-badge ${o.status || 'pending'}">${STATUS_LABELS[o.status] || "Pending"}</span>
        </div>
        ${o.orderNumber ? `
        <div class="muted" style="font-size:11px; display:flex; align-items:center; gap:6px; margin:2px 0;">
          Order #${o.orderNumber}
          <button type="button" onclick="copyOrderNum('${o.orderNumber}', this)" style="font-size:10px; padding:2px 7px; border-radius:6px; border:1px solid #ddd; background:white; cursor:pointer;">Copy</button>
        </div>` : ""}
        <div class="muted" style="font-size:12px;">${o.phone || ""} · ${o.address || ""}${o.city ? `, ${o.city}` : ""}${o.postalCode ? ` ${o.postalCode}` : ""}</div>
        <div class="order-items" style="display:flex; flex-wrap:wrap; gap:8px; margin:8px 0;">
          ${(o.items||[]).map(it => `
            <div style="display:flex; align-items:center; gap:6px; background:var(--bg,#f5f5f5); border-radius:8px; padding:4px 8px 4px 4px;">
              <img src="${it.image || 'https://placehold.co/40x40?text=No+Img'}" style="width:32px; height:32px; object-fit:cover; border-radius:6px;">
              <span style="font-size:12px;">${it.name}${it.sku ? ` · SKU: ${it.sku}` : ""} ×${it.qty}</span>
            </div>
          `).join("")}
        </div>
        <button type="button" class="edit-btn" style="margin-bottom:8px;" onclick="toggleOrderDetails('${o.id}')">${isOpen ? "Hide details ▲" : "View details ▼"}</button>
        ${isOpen ? `
          <div class="order-details-expanded" style="background:var(--bg,#f7f7f7); border-radius:10px; padding:12px; margin-bottom:8px; font-size:13px;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px dashed #ccc; padding-bottom:8px; margin-bottom:8px;">
              <strong>Invoice</strong>
              ${o.orderNumber ? `<span class="muted">#${o.orderNumber}</span>` : ""}
            </div>
            <div><strong>Customer:</strong> ${o.customerName || "—"}</div>
            <div><strong>Phone:</strong> ${o.phone || "—"}</div>
            <div><strong>Address:</strong> ${o.address || "—"}${o.city ? `, ${o.city}` : ""}${o.postalCode ? ` — ${o.postalCode}` : ""}</div>
            <div><strong>Payment:</strong> ${paymentLabel(o.payment)}</div>
            <div style="margin-top:8px;"><strong>Items:</strong></div>
            ${(o.items||[]).map(it => `
              <div style="display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid #eee;">
                <img src="${it.image || 'https://placehold.co/60x60?text=No+Img'}" style="width:56px; height:56px; object-fit:cover; border-radius:8px;">
                <div>
                  <div><strong>${it.name}</strong></div>
                  <div class="muted">${it.sku ? `SKU: ${it.sku} · ` : ""}Rs. ${Number(it.price||0).toLocaleString()} × ${it.qty} = Rs. ${Number((it.price||0)*(it.qty||0)).toLocaleString()}</div>
                </div>
              </div>
            `).join("")}
            <div style="margin-top:8px; padding-top:8px; border-top:1px dashed #ccc;">
              <div style="display:flex; justify-content:space-between;"><span class="muted">Subtotal</span><span>Rs. ${Number(o.itemsTotal ?? o.total ?? 0).toLocaleString()}</span></div>
              <div style="display:flex; justify-content:space-between;"><span class="muted">Shipping</span><span>${o.shippingFee ? `Rs. ${Number(o.shippingFee).toLocaleString()}` : "Free"}</span></div>
              <div style="display:flex; justify-content:space-between; font-weight:700; margin-top:4px;"><span>Total</span><span>Rs. ${Number(o.total||0).toLocaleString()}</span></div>
            </div>
          </div>
        ` : ""}
        <div class="order-bottom">
          <span>Total: Rs. ${Number(o.total||0).toLocaleString()} · ${paymentLabel(o.payment)}</span>
          <select onchange="updateStatus('${o.id}', this.value)">
            <option value="pending" ${o.status==="pending"?"selected":""}>Pending</option>
            <option value="confirmed" ${o.status==="confirmed"?"selected":""}>Confirmed</option>
            <option value="shipped" ${o.status==="shipped"?"selected":""}>Shipped</option>
            <option value="out_for_delivery" ${o.status==="out_for_delivery"?"selected":""}>Out for Delivery</option>
            <option value="delivered" ${o.status==="delivered"?"selected":""}>Delivered</option>
          </select>
        </div>
      </div>
    `;
    }).join("");
  }

  window.toggleOrderDetails = function(id) {
    if (expandedOrders.has(id)) expandedOrders.delete(id);
    else expandedOrders.add(id);
    renderOrders(lastOrders);
  };

  window.copyOrderNum = function(num, btn) {
    navigator.clipboard.writeText(num).then(() => {
      const old = btn.textContent;
      btn.textContent = "Copied ✓";
      setTimeout(() => btn.textContent = old, 1500);
    });
  };

  window.updateStatus = async function(id, status) {
    await updateDoc(doc(db, "orders", id), { status });
  };

  window.markOrdersSeen = function() {
    seenOrderIds = Array.from(new Set([...seenOrderIds, ...lastOrders.map(o => o.id)]));
    localStorage.setItem("seenOrderIds", JSON.stringify(seenOrderIds));
    updateBadge(0);
    renderOrders(lastOrders);
  };

  window.addEventListener("DOMContentLoaded", () => {
    document.title = STORE_NAME + " — Admin";
  });
</script>

<style>
  :root {
    --ink: #111827; --teal: #2563EB; --teal-deep: #1E3A8A;
    --saffron: #F97316; --cream: #F8FAFC; --coral: #DC2626; --line: #E2E8F0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--cream); color: var(--ink); }
  h1, h2, .brand { font-family: 'Space Grotesk', sans-serif; }

  #login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--teal-deep);
  }
  .login-card { background: white; padding: 32px 26px; border-radius: 16px; width: 100%; max-width: 340px; }
  .login-card h1 { font-size: 20px; margin: 0 0 4px; }
  .login-card p { color: #8a8375; font-size: 13px; margin: 0 0 20px; }
  .login-card input {
    width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 9px; border: 1px solid var(--line);
    font-family: 'Inter'; font-size: 14px; background: var(--cream);
  }
  .login-card button {
    width: 100%; padding: 12px; background: var(--saffron); color: var(--teal-deep); border: none;
    border-radius: 9px; font-weight: 700; cursor: pointer; font-size: 14px;
  }
  .error-text { color: var(--coral); font-size: 12px; margin-top: 8px; }

  header {
    background: var(--teal); color: white; padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 5;
  }
  header .brand { font-size: 18px; font-weight: 700; }
  header button { background: none; border: 1px solid rgba(255,255,255,0.4); color: white; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }

  .tabs { display: flex; gap: 8px; padding: 16px 20px 0; max-width: 640px; margin: 0 auto; }
  .tab-btn {
    flex: 1; padding: 10px 4px; border: none; background: white; border-radius: 10px 10px 0 0;
    font-weight: 600; font-size: 11.5px; cursor: pointer; opacity: 0.5;
  }
  .tab-btn.active { opacity: 1; background: var(--cream); border-bottom: 3px solid var(--saffron); }

  main { max-width: 640px; margin: 0 auto; padding: 0 20px 60px; }
  .tab-panel { display: none; }

  #product-form { background: white; border-radius: 14px; padding: 18px; margin-bottom: 20px; border: 1px solid var(--line); }
  #product-form h3, #settings-form h3 { margin: 0 0 12px; font-size: 15px; }
  #settings-form { background: white; border-radius: 14px; padding: 18px; border: 1px solid var(--line); }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .field input, .field textarea {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line);
    font-family: 'Inter'; font-size: 14px; background: var(--cream);
  }
  .form-row { display: flex; gap: 10px; }
  .form-row .field { flex: 1; }
  .form-actions { display: flex; gap: 10px; margin-top: 4px; }
  .form-actions button {
    padding: 10px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 13px;
  }
  #save-btn, #save-settings-btn { background: var(--teal); color: white; }
  #cancel-edit { background: #eee; display: none; }

  .prod-row, .order-card {
    background: white; border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--line);
  }
  .prod-row { display: flex; align-items: center; gap: 10px; }
  .prod-row img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
  .prod-info { flex: 1; display: flex; flex-direction: column; font-size: 13px; }
  .muted { color: #8a8375; font-size: 12px; }
  .edit-btn, .del-btn { border: none; border-radius: 7px; padding: 7px 10px; font-size: 12px; cursor: pointer; font-weight: 600; }
  .edit-btn { background: var(--saffron); color: var(--teal-deep); }
  .del-btn { background: var(--coral); color: white; margin-left: 6px; }

  .order-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .status-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; text-transform: capitalize; }
  .status-badge.pending { background: #FBE7C6; color: #8a5a00; }
  .status-badge.confirmed { background: #D6E9E0; color: #0E4B45; }
  .status-badge.shipped { background: #DCE7FB; color: #1E3A8A; }
  .status-badge.out_for_delivery { background: #FDE3D3; color: #9A3412; }
  .status-badge.delivered { background: #D8E8D0; color: #33691e; }
  .order-items { font-size: 13px; margin: 6px 0; }
  .order-bottom { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-top: 6px; }
  .order-bottom select { border-radius: 6px; border: 1px solid var(--line); padding: 4px 6px; font-size: 12px; }
  .empty { text-align: center; color: #9a9384; padding: 30px 0; }

  .badge-count {
    display: none; align-items: center; justify-content: center;
    background: var(--coral); color: white; font-size: 11px; font-weight: 700;
    min-width: 18px; height: 18px; border-radius: 999px; padding: 0 5px; margin-left: 4px;
  }
  .order-card.unread { border: 1px solid var(--saffron); box-shadow: 0 0 0 3px rgba(233,162,59,0.15); }

  .order-toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--teal-deep); color: white; padding: 12px 18px; border-radius: 12px;
    font-size: 13px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 50;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25); max-width: 90%; text-align: center;
  }
  .order-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>Admin login</h1>
    <p id="store-label">Manage products & orders</p>
    <form onsubmit="doLogin(event)">
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>
    <div id="login-error" class="error-text"></div>
  </div>
</div>

<div id="admin-screen" style="display:none;">
  <header>
    <span class="brand">Admin</span>
    <div style="display:flex; align-items:center; gap:10px;">
      <span id="who" style="font-size:12px; opacity:0.8;"></span>
      <button onclick="doLogout()">Log out</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="btn-add" onclick="switchTab('add')">Add Product</button>
    <button class="tab-btn" id="btn-products" onclick="switchTab('products')">All Products</button>
    <button class="tab-btn" id="btn-orders" onclick="switchTab('orders')">Orders <span id="orders-badge" class="badge-count"></span></button>
    <button class="tab-btn" id="btn-settings" onclick="switchTab('settings')">Web Changes</button>
  </div>

  <main>
    <div class="tab-panel" id="tab-add" style="display:block;">
      <form id="product-form" onsubmit="saveProduct(event)">
        <h3 id="form-title">Add product</h3>
        <div class="field"><label>Name <span style="color:#e11;">*</span></label><input id="p-name" required></div>
        <div class="field"><label>Price (Rs.) <span style="color:#e11;">*</span></label><input id="p-price" type="number" required></div>
        <div class="field"><label>Quantity <span style="color:#e11;">*</span></label><input id="p-stock" type="number" required></div>
        <div class="field"><label>Photos (1–10) <span style="color:#e11;">*</span></label>
          <input type="file" id="p-image-file" accept="image/*" multiple onchange="handleImageUpload(event)">
          <span id="upload-status" class="muted"></span>
          <div id="p-image-previews" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>SKU (optional)</label><input id="p-sku" placeholder="e.g. WCH-001"></div>
          <div class="field"><label>Compare-at price (optional)</label><input id="p-compare" type="number" placeholder="original price"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Category (optional)</label><input id="p-category" placeholder="e.g. Watches"></div>
          <div class="field"><label>Badge (optional)</label><input id="p-badge" placeholder="e.g. New, Sale"></div>
        </div>
        <div class="field"><label>Description (optional)</label><textarea id="p-desc" rows="2"></textarea></div>
        <div class="form-actions">
          <button type="submit" id="save-btn">Save product</button>
          <button type="button" id="cancel-edit" onclick="cancelEdit()">Cancel edit</button>
        </div>
      </form>
    </div>

    <div class="tab-panel" id="tab-products">
      <div class="field" style="margin-bottom:14px;">
        <input id="product-search" placeholder="Search by SKU or name..." oninput="renderProductList(this.value)">
      </div>
      <div id="product-list"></div>
    </div>

    <div class="tab-panel" id="tab-orders">
      <div id="order-list"></div>
    </div>

    <div class="tab-panel" id="tab-settings">
      <form id="settings-form" onsubmit="saveSettings(event)">
        <h3>Web Changes</h3>
        <div class="field"><label>Store name</label><input id="s-storename" placeholder="e.g. Bahoo Traders"></div>
        <div class="field"><label>Top scrolling bar text</label><input id="s-marquee" placeholder="e.g. CASH ON DELIVERY AVAILABLE"></div>
        <div class="field"><label>Contact number (shown on website)</label><input id="s-contact" placeholder="e.g. 0300-1234567"></div>
        <div class="field"><label>Contact email / Gmail (shown on website)</label><input id="s-email" type="email" placeholder="e.g. yourstore@gmail.com"></div>
        <div class="field"><label>JazzCash number</label><input id="s-jazzcash" placeholder="e.g. 0300-1234567"></div>
        <div class="field"><label>Easypaisa number</label><input id="s-easypaisa" placeholder="e.g. 0300-1234567"></div>
        <div class="field"><label>Shipping charges (Rs.) — shown at checkout</label><input id="s-shipping" type="number" placeholder="e.g. 300"></div>
        <div class="form-actions">
          <button type="submit" id="save-settings-btn">Save changes</button>
          <span id="settings-status" class="muted"></span>
        </div>
      </form>
    </div>
  </main>
</div>

</body>
</html>
